{{- define "common.container.tpl" -}}
name: {{ template "robustName" .Release.Name }}
securityContext:
  {{- toYaml .Values.securityContext | nindent 2 }}
image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
imagePullPolicy: {{ .Values.image.pullPolicy }}
{{- if .Values.command }}
command:
  - {{ .Values.shell }}
  - -c
  - {{ .Values.command | quote }}
{{- end }}
ports:
  {{- if not .Values.ports }}
  - name: http
    containerPort: {{ .Values.containerPort }}
    protocol: TCP
  {{- else }}
  {{- range .Values.ports }}
  - name: {{ .name }}
    containerPort: {{ .containerPort }}
    protocol: TCP
  {{- end }}
  {{- end }}
{{- if .Values.startupProbe.enabled }}
startupProbe:
  httpGet:
    path: {{ .Values.startupProbe.path }}
    port: {{ default .Values.containerPort .Values.startupProbe.port }}
    scheme: {{ default "HTTP" .Values.startupProbe.scheme }}
    {{- with .Values.startupProbe.httpHeaders }}
    httpHeaders:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.startupProbe.settings }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- if .Values.probe.enabled }}
readinessProbe:
  httpGet:
    path: {{ .Values.probe.path }}
    port: {{ default .Values.containerPort .Values.probe.port }}
    scheme: {{ default "HTTP" .Values.probe.scheme }}
    {{- with .Values.probe.httpHeaders }}
    httpHeaders:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.probe.settings }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- if .Values.livenessProbe.enabled }}
livenessProbe:
  httpGet:
    path: {{ .Values.livenessProbe.path }}
    port: {{ default .Values.containerPort .Values.livenessProbe.port }}
    scheme: {{ default "HTTP" .Values.livenessProbe.scheme }}
    {{- with .Values.livenessProbe.httpHeaders }}
    httpHeaders:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.livenessProbe.settings }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- if not .Values.resources.ignore }}
resources:
  {{- if .Values.resources.ignoreLimits }}
  requests:
    {{- toYaml .Values.resources.requests | nindent 4 }}
  {{- else }}
    {{- toYaml .Values.resources | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
