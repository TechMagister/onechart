image:
  repository: nginx
  tag: "latest"
  pullPolicy: IfNotPresent

# ingress:
#   host: chart-example.local
#   ingressClassName: nginx
#   tlsEnabled: true
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-staging
#   nginxBasicAuth:
#     user: admin
#     password: secret

# vars:
#   MY_VAR: "value"

replicas: 1

nameOverride: ""
fullnameOverride: ""

# Optional: the name of the component within the architecture.
# See https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/
# Example: "api", "worker", "database"
component: ""

# Optional: the name of a higher level application this one is part of.
# See https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/
# Example: "assistant-ia"
partOf: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 999

securityContext: {}

containerPort: 80

resources:
  requests:
    cpu: "200m"
    memory: "200Mi"

nodeSelector: {}

tolerations: []

probe:
  enabled: false
  path: "/"
  # Port targeted by the probe. Defaults to containerPort when left empty.
  # Point it at a dedicated health endpoint: probing an application route
  # executes the route on every period.
  port: ""
  # HTTP or HTTPS.
  scheme: HTTP
  # Optional extra HTTP headers, e.g. [{name: Host, value: example.com}].
  httpHeaders: []
  settings:
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

# Before you use a liveness probe: https://srcco.de/posts/kubernetes-liveness-probes-are-dangerous.html
livenessProbe:
  enabled: false
  path: "/"
  # Port targeted by the probe. Defaults to containerPort when left empty.
  port: ""
  # HTTP or HTTPS.
  scheme: HTTP
  # Optional extra HTTP headers, e.g. [{name: Host, value: example.com}].
  httpHeaders: []
  settings:
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    failureThreshold: 3

# A startup probe defers the readiness and liveness probes until the
# application has started. While it runs, the pod counts as "not ready yet"
# instead of "failing", so slow boots do not trigger restarts.
startupProbe:
  enabled: false
  path: "/"
  # Port targeted by the probe. Defaults to containerPort when left empty.
  port: ""
  # HTTP or HTTPS.
  scheme: HTTP
  # Optional extra HTTP headers, e.g. [{name: Host, value: example.com}].
  httpHeaders: []
  settings:
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    # 30 x 10s = 5 minutes of boot budget.
    failureThreshold: 30

secretEnabled: false

shell: "/bin/sh"

podDisruptionBudgetEnabled: true
spreadAcrossNodes: false

nodePortEnabled: false

# Set true to enable service monitor.
monitor:
  enabled: false

# Generates a logging.banzaicloud.io/v1beta1 Flow resource for the logs
# of this release. The match section is managed automatically and selects
# the pods of this release based on their app.kubernetes.io labels.
# logging:
#   framework: slog_json
#   globalOutputRefs:
#     - loki-output
#   localOutputRefs:
#     - my-local-output
#   filters:
#     - record_transformer:
#         records:
#           - foo: bar

container: {}
podSpec: {}
